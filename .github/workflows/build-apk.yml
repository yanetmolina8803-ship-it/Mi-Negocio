
name: Crear APK de Mi Negocio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Encontrar proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -type f -name settings.gradle \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)

          if [ -z "$SETTINGS" ]; then
            echo "Buscando proyecto dentro de archivos ZIP..."
            mkdir -p .extraido

            while IFS= read -r -d '' ZIP; do
              DEST=".extraido/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST"

              SETTINGS=$(find "$DEST" -type f -name settings.gradle \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print -quit || true)

              if [ -n "$SETTINGS" ]; then
                break
              fi
            done < <(find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.extraido/*' -print0)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          test -f "$ROOT/app/build.gradle" || {
            echo "ERROR: Falta app/build.gradle"
            exit 1
          }

          test -f "$ROOT/app/src/main/assets/index.html" || {
            echo "ERROR: Falta index.html"
            exit 1
          }

          echo "Proyecto encontrado en: $ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verificar selector de Inversión
        working-directory: ${{ steps.proyecto.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          archivo = Path("app/src/main/assets/index.html")
          html = archivo.read_text(encoding="utf-8")

          selector = '<select id="unit${i}"'
          unidades = [
              'value="lb"',
              'value="kg"',
              'value="saco"',
              'value="pomo"',
              'value="caja"',
              'value="pqte"',
              'value="otros"',
          ]

          if selector not in html:
              raise SystemExit(
                  "ERROR: No aparece el selector desplegable de Inversión."
              )

          for unidad in unidades:
              if unidad not in html:
                  raise SystemExit(f"ERROR: Falta la opción {unidad}.")

          print("Selector de Inversión encontrado.")
          print("Las siete unidades están presentes.")
          PY

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: ${{ steps.proyecto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
