
name: Crear APK de Mi Negocio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar archivos del proyecto
        run: |
          echo "Buscando settings.gradle..."
          find . -name settings.gradle -not -path "*/.gradle/*"

          if [ ! -f settings.gradle ]; then
            echo "ERROR: No se encontro settings.gradle en la raiz."
            exit 1
          fi

          if [ ! -f app/build.gradle ]; then
            echo "ERROR: No se encontro app/build.gradle."
            exit 1
          fi

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
