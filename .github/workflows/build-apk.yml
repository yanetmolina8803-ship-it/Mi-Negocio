
name: Crear APK de Mi Negocio

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar o extraer el proyecto
        id: proyecto
        shell: bash
        run: |
          set -e
          echo "Buscando settings.gradle en el repositorio..."
          SETTINGS=$(find . -type f -name settings.gradle -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            mkdir -p proyecto_extraido
            while IFS= read -r ARCHIVO_ZIP; do
              [ -z "$ARCHIVO_ZIP" ] && continue
              DESTINO="proyecto_extraido/$(basename "$ARCHIVO_ZIP" .zip)"
              mkdir -p "$DESTINO"
              echo "Probando archivo: $ARCHIVO_ZIP"
              unzip -oq "$ARCHIVO_ZIP" -d "$DESTINO" || true
              SETTINGS=$(find "$DESTINO" -type f -name settings.gradle -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)
              if [ -n "$SETTINGS" ]; then break; fi
            done < <(find . -maxdepth 4 -type f -iname '*.zip' -not -path './.git/*' -not -path './proyecto_extraido/*' | sort)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle ni dentro de un ZIP del repositorio."
            echo "Contenido del repositorio:"
            find . -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          CARPETA=$(dirname "$SETTINGS")
          if [ ! -f "$CARPETA/app/build.gradle" ]; then
            echo "ERROR: Se encontró settings.gradle en $CARPETA, pero falta app/build.gradle."
            exit 1
          fi
          echo "Proyecto encontrado en: $CARPETA"
          echo "dir=$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: ${{ steps.proyecto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
