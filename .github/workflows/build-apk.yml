
name: Crear APK de Mi Negocio

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar o extraer proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando settings.gradle..."
          SETTINGS="$(find . -type f -name settings.gradle \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS" ]; then
            echo "No se encontró el proyecto. Buscando archivos ZIP..."
            mkdir -p .proyecto_extraido

            while IFS= read -r -d '' ZIP; do
              DEST=".proyecto_extraido/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"

              echo "Extrayendo: $ZIP"
              unzip -oq "$ZIP" -d "$DEST"

              SETTINGS="$(find "$DEST" -type f -name settings.gradle \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print -quit || true)"

              if [ -n "$SETTINGS" ]; then
                break
              fi
            done < <(find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.proyecto_extraido/*' \
              -print0)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No aparece settings.gradle."
            find . -maxdepth 5 -type f \
              -not -path './.git/*' | sort | head -n 250
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "ERROR: Falta app/build.gradle"
            exit 1
          fi

          if [ ! -f "$ROOT/app/src/main/assets/index.html" ]; then
            echo "ERROR: Falta index.html"
            exit 1
          fi

          echo "Proyecto encontrado: $ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verificar selector de unidad en Inversión
        working-directory: ${{ steps.proyecto.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          HTML="app/src/main/assets/index.html"

          grep -q '<select id="unit' "$HTML" || {
            echo "ERROR: No se encontró el selector de unidad de Inversión."
            exit 1
          }

          for UNIT in lb kg saco pomo caja pqte otros; do
            grep -q "value=\"$UNIT\"" "$HTML" || {
              echo "ERROR: Falta la opción $UNIT."
              exit 1
            }
          done

          echo "Selector y siete unidades encontrados."

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: ${{ steps.proyecto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
