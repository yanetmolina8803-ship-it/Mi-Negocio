

name: Crear APK Mi Negocio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos de GitHub
        uses: actions/checkout@v4

      - name: Extraer ZIP del proyecto
        run: |
          ZIP="Mi_Negocio_APK_Proyecto_v2.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP"
            exit 1
          fi
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Corregir compatibilidad Java y Kotlin
        run: |
          SETTINGS=$(find proyecto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          cd "$DIR"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: No se encontró app/build.gradle")

          s = p.read_text()
          if "android {" not in s:
              raise SystemExit("ERROR: No se encontró el bloque android en app/build.gradle")

          fix = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          s = s.replace("android {", "android {\n" + fix, 1)
          p.write_text(s)
          print("Configuración Java/Kotlin añadida.")
          PY

      - name: Compilar APK
        run: |
          SETTINGS=$(find proyecto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          DIR=$(dirname "$SETTINGS")
          cd "$DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
