
name: Crear APK de Mi Negocio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f -name settings.gradle \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          CARPETA=$(dirname "$SETTINGS")

          if [ ! -f "$CARPETA/app/build.gradle" ]; then
            echo "ERROR: Falta app/build.gradle en $CARPETA"
            exit 1
          fi

          echo "Proyecto encontrado: $CARPETA"
          echo "dir=$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Verificar unidades de Inversión
        working-directory: ${{ steps.proyecto.outputs.dir }}
        shell: bash
        run: |
          set -e

          HTML="app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERROR: No existe $HTML"
            exit 1
          fi

          for unidad in lb kg saco pomo caja pqte otros; do
            if ! grep -qi "value=\"$unidad\"" "$HTML"; then
              echo "ERROR: Falta la unidad $unidad en index.html"
              exit 1
            fi
          done

          echo "Las siete unidades están presentes."

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-APK
          path: ${{ steps.proyecto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
